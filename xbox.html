        .controller-cursor {
      position: absolute;
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 100;
      border: 2px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
    }
    
    .controller-hint {
      position: absolute;
      bottom: 60px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      display: none;
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      transition: background-color 5s linear;
    }
    canvas {
      display: block;
      background-color: #87CEEB;
    }
    .menu-container {
      position: absolute;
      top: 50px;
      left: 50px;
      width: 200px;
      height: 300px;
      background-color: rgba(0, 0, 0, 0.8);
      overflow-y: scroll;
      padding: 10px;
      border-radius: 5px;
      display: none;
    }
    .menu-item {
      color: white;
      font-size: 20px;
      padding: 10px;
      cursor: pointer;
    }
    .menu-item:hover {
      background-color: yellow;
    }
    .menu-item.selected {
      background-color: blue;
    }
    .search-input {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      margin-bottom: 10px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .health-display {
      position: absolute;
      top: 10px;
      right: 10px;
      color: white;
      font-size: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 5px 10px;
      border-radius: 5px;
      display: flex;
      gap: 10px;
    }
    .animal-ui {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #fullscreenButton {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 100;
      padding: 8px 16px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }
    #fullscreenButton:hover {
      background-color: rgba(0, 0, 0, 0.9);
    }
    .infection-effect {
      position: absolute;
      width: 50px;
      height: 50px;
      background-color: rgba(255, 0, 0, 0.5);
      border-radius: 50%;
      pointer-events: none;
      animation: infectPulse 1s forwards;
    }
    .time-display {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 5px 10px;
      border-radius: 5px;
    }
    .seed-display {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 16px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 5px 10px;
      border-radius: 5px;
    }
    @keyframes infectPulse {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    /* Biome Notification Styles */
    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }

    #biome-notification {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;

    class SpriteAnimationBlock {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = blockSize;
        this.height = blockSize;
        this.spriteSheet = new Image();
        this.spriteSheet.src = "../asset/hi.png";
        this.frameWidth = 32;
        this.frameHeight = 32;
        this.totalFrames = 16;
        this.currentFrame = 0;
        this.fps = 10;
        this.frameTime = 1000 / this.fps;
        this.lastFrameTime = 0;
      }

      update(timestamp) {
        if (timestamp - this.lastFrameTime > this.frameTime) {
          this.lastFrameTime = timestamp;
          this.currentFrame = (this.currentFrame + 1) % this.totalFrames;
        }
      }

      draw() {
        if (this.spriteSheet.complete) {
          const scaleX = this.width / this.frameWidth;
          const scaleY = this.height / this.frameHeight;
          const scale = Math.min(scaleX, scaleY);
          ctx.drawImage(
            this.spriteSheet,
            0, this.currentFrame * this.frameHeight,
            this.frameWidth, this.frameHeight,
            this.x, this.y,
            this.frameWidth * scale, this.frameHeight * scale
          );
        }
      }
    }

    class Projectile {
      constructor(x, y, targetX, targetY, type, damage, radius, faction) {
        this.x = x;
        this.y = y;
        this.targetX = targetX;
        this.targetY = targetY;
        this.width = 20;
        this.height = 20;
        this.speed = 5;
        this.type = type;
        this.damage = damage;
        this.explosionRadius = radius;
        this.faction = faction;
        
        this.texture = new Image();
        this.texture.src = type === "fireball" ? "../asset/fireball.png" : "../asset/wither_skull.png";
        
        // Calculate direction
        const dx = targetX - x;
        const dy = targetY - y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        this.vx = (dx / distance) * this.speed;
        this.vy = (dy / distance) * this.speed;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        // Check if out of bounds
        if (this.x + this.width < 0 || this.x > canvas.width || 
            this.y + this.height < 0 || this.y > canvas.height) {
          this.remove();
          return;
        }

        // Check collision with blocks
        for (let i = 0; i < world.length; i++) {
          const block = world[i];
          if (this.collidesWith(block)) {
            this.explode(block.x, block.y);
            this.remove();
            return;
          }
        }

        // Check collision with mobs
        animals.forEach(animal => {
          if (this.collidesWith(animal)) {
            // Only hit valid targets based on faction
            if ((this.faction === FACTION.HOSTILE && (animal.faction === FACTION.HUMAN || animal.faction === FACTION.PEACEFUL)) ||
                (this.faction === FACTION.NEUTRAL && animal.faction === FACTION.HOSTILE)) {
              this.explode(animal.x, animal.y);
              this.remove();
              return;
            }
          }
        });
      }

      collidesWith(obj) {
        return this.x < obj.x + obj.width &&
               this.x + this.width > obj.x &&
               this.y < obj.y + obj.height &&
               this.y + this.height > obj.y;
      }

      explode(x, y) {
        // Damage blocks
        for (let i = world.length - 1; i >= 0; i--) {
          const block = world[i];
          const dx = block.x - x;
          const dy = block.y - y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < this.explosionRadius * blockSize) {
            // Stop jukebox music if destroyed
            if (block.type === "JukeBox") {
              jukeboxSound1.pause();
              jukeboxSound2.pause();
              jukeboxState = 0;
              jukeboxPlaying = null;
            }
            world.splice(i, 1);
          }
        }

        // Damage mobs
        animals.forEach(animal => {
          const dx = animal.x - x;
          const dy = animal.y - y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          if (distance < this.explosionRadius * blockSize) {
            // Check faction rules
            if ((this.faction === FACTION.HOSTILE && (animal.faction === FACTION.HUMAN || animal.faction === FACTION.PEACEFUL)) ||
                (this.faction === FACTION.NEUTRAL && animal.faction === FACTION.HOSTILE)) {
              animal.health -= this.damage;
              if (animal.health <= 0) {
                animal.isDead = true;
              }
            }
          }
        });
      }

      remove() {
        const array = this.type === "fireball" ? fireballs : witherSkulls;
        const index = array.indexOf(this);
        if (index !== -1) {
          array.splice(index, 1);
        }
      }

      draw() {
        ctx.drawImage(this.texture, this.x, this.y, this.width, this.height);
      }
    }

    class Animal {
  constructor(x, y, type, speed) {

    this.growthTimer = 0;

    this.leftTexture.src = `../asset/left${this.textureName}.png`;
    this.leftTexture.onerror = () => { this.leftTexture.src = errorTexture; };

    this.trappedTexture.onerror = () => { this.trappedTexture.src = errorTexture; };

    this.deathTexture = new Image();
    this.deathTexture.src = deathTexture;
    this.deathTexture.onerror = () => { this.deathTexture.src = errorTexture; };

    this.currentTexture = this.leftTexture;
  }

  isSurrounded() {
    const gridX = Math.floor(this.x / blockSize);
    const gridY = Math.floor(this.y / blockSize);

    const hasBlockAbove = world.some(block => block.x === gridX * blockSize && block.y === (gridY - 1) * blockSize);
    const hasBlockBelow = world.some(block => block.x === gridX * blockSize && block.y === (gridY + 1) * blockSize);
    const hasBlockLeft = world.some(block => block.x === (gridX - 1) * blockSize && block.y === gridY * blockSize);
    const hasBlockRight = world.some(block => block.x === (gridX + 1) * blockSize && block.y === gridY * blockSize);

    return hasBlockAbove && hasBlockBelow && hasBlockLeft && hasBlockRight;
  }

  detectAndEatAnimals() {
    if (this.eatCooldown > 0 || !(this.type === "Bob" || this.type === "Lilly") || this.health >= 5) {
      this.eatCooldown--;
      return;
    }

    const detectionRange = 50;
    for (let i = 0; i < animals.length; i++) {
      const animal = animals[i];
      if (animal === this || animal.isZombie) continue;

      const dx = animal.x - this.x;
      const dy = animal.y - this.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < detectionRange) {
        animals.splice(i, 1);
        this.health = Math.min(this.health + 2, 10);
        this.eatCooldown = 300;
        break;
      }
    }
  }

  checkForWall() {
    const gridX = Math.floor(this.x / blockSize);
    const gridY = Math.floor(this.y / blockSize);
    const nextX = gridX + this.currentDirection;
    const nextY = gridY;
    const hasBlock = world.some(b => b.x === nextX * blockSize && b.y === nextY * blockSize);
    const hasTallWall = world.some(b => b.x === nextX * blockSize && b.y === (nextY - 1) * blockSize);
    return hasBlock || hasTallWall;
  }

  updateAI(timestamp) {
    if (this.type === "Zombie") {
      let closestTarget = null;
      let closestDistance = Infinity;
      
      animals.forEach(animal => {
        if (animal === this || 
            animal.faction === FACTION.HOSTILE || 
            animal.faction === FACTION.NEUTRAL) return;
            
        const dx = animal.x - this.x;
        const dy = animal.y - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance < closestDistance && distance < this.attackRange) {
          closestDistance = distance;
          closestTarget = animal;
        }
      });

      if (closestTarget) {
        this.currentDirection = closestTarget.x > this.x ? 1 : -1;
        this.isMoving = true;
        
        if (this.isOnGround && Math.random() < 0.05) {
          this.velocityY = -10;
        }
        return;
      }
    }
    
    if (this.thinkTimer > 0) {
      this.thinkTimer -= 16;
      this.currentDirection = 0;
      this.isMoving = false;
      
      if (this.thinkTimer <= 0) {
        this.currentDirection = Math.random() > 0.5 ? 1 : -1;
        this.moveTimer = animalProperties[this.type].moveTime || 3000;
        this.isMoving = true;
      }
    } else if (this.moveTimer > 0) {
      this.moveTimer -= 16;
      this.isMoving = true;
      
      if (this.moveTimer <= 0) {
        this.thinkTimer = animalProperties[this.type].thinkTime || 2000;
        this.currentDirection = 0;
        this.isMoving = false;
      }
    }
  }

  updateHostile() {
    if (this.type === "Ghast") {
      this.updateGhast();
    } else if (this.type === "Wither") {
      this.updateWither();
    }
  }

  updateGhast() {
    if (this.fireballCooldown <= 0) {
      const target = this.findTarget();
      if (target) {
        fireballs.push(new Projectile(
          this.x, this.y, 
          target.x, target.y, 
          "fireball", 
          8,
          5,
          FACTION.HOSTILE
        ));
        this.fireballCooldown = animalProperties[this.type].fireballCooldown;
      }
    } else {
      this.fireballCooldown -= 16;
    }
  }

  updateWither() {
    if (this.skullCount < this.maxSkulls) {
      if (this.skullCooldown <= 0) {
        this.skullCount++;
        this.skullCooldown = animalProperties[this.type].skullCooldown;
      } else {
        this.skullCooldown -= 16;
      }
    }

    if (this.skullCount > 0) {
      const target = this.findTarget();
      if (target) {
        witherSkulls.push(new Projectile(
          this.x, this.y, 
          target.x, target.y, 
          "skull", 
          12,
          6,
          FACTION.HOSTILE
        ));
        this.skullCount--;
      }
    }
  }

  findTarget() {
    let closestTarget = null;
    let closestDistance = Infinity;

    animals.forEach(animal => {
      if (animal === this) return;
      
      if (animal.faction === FACTION.HUMAN || animal.faction === FACTION.PEACEFUL) {
        const dx = animal.x - this.x;
        const dy = animal.y - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance < closestDistance && distance < this.attackRange) {
          closestDistance = distance;
          closestTarget = animal;
        }
      }
    });

    return closestTarget;
  }

  updateDriedGhast() {
    let isSubmerged = false;
    for (const block of world) {
      if (block.type === "Water" &&
          this.x >= block.x && this.x <= block.x + blockSize &&
          this.y >= block.y && this.y <= block.y + blockSize) {
        isSubmerged = true;
        break;
      }
    }

    if (isSubmerged) {
      this.submergedTimer += 16;
      if (this.submergedTimer >= this.transformTime) {
        const index = animals.indexOf(this);
        animals.splice(index, 1);
        animals.push(new Animal(this.x, this.y, "Ghast", 2));
      }
    } else {
      this.submergedTimer = Math.max(0, this.submergedTimer - 8);
    }
  }

  update() {
    if (isPaused || this.isDead) return;

    // NEW: Handle flying mobs
    if (this.canFly) {
      this.isOnGround = false;
      this.velocityY = 0;
      if (Math.random() < 0.02) {
        this.y += (Math.random() - 0.5) * 2;
      }
    }

    // NEW: Handle swimming mobs
    const isInWater = world.some(block => 
      block.type === "Water" &&
      this.x >= block.x && this.x <= block.x + blockSize &&
      this.y >= block.y && this.y <= block.y + blockSize
    );

    if (this.canSwim) {
      if (isInWater) {
        if (this.isMoving && Math.random() < 0.1) {
          this.y += (Math.random() - 0.5) * this.speed;
        }
        this.underwaterTimer = 0;
      }
    } else {
      if (isInWater && !this.isOnGround) {
        this.velocityY = Math.min(this.velocityY, 0.5);
      }
    }

    if (this.type === "Dried ghast") {
      this.updateDriedGhast();
      return;
    }

    this.updateAI(Date.now());

    if (this.type === "Zombie" && this.infectionCooldown <= 0 && !this.isTrapped) {
      animals.forEach((otherAnimal, index) => {
        if (otherAnimal === this || 
            otherAnimal.faction === FACTION.HOSTILE || 
            otherAnimal.faction === FACTION.NEUTRAL) return;

        if (this.x < otherAnimal.x + otherAnimal.width &&
            this.x + this.width > otherAnimal.x &&
            this.y < otherAnimal.y + otherAnimal.height &&
            this.y + this.height > otherAnimal.y) {
          
          if (Math.random() < 0.5) {
            effects.push({
              x: otherAnimal.x + otherAnimal.width/2,
              y: otherAnimal.y + otherAnimal.height/2,
              type: "infection",
              lifetime: 60
            });
            
            otherAnimal.isZombie = true;
            otherAnimal.textureName = "zombie";
            otherAnimal.rightTexture.src = `../asset/zombie.png`;
            otherAnimal.leftTexture.src = `../asset/leftzombie.png`;
            otherAnimal.trappedTexture.src = `../asset/trapzombie.png`;
            otherAnimal.faction = FACTION.HOSTILE;
            otherAnimal.type = "Zombie";
            otherAnimal.speed = animalProperties["Zombie"].speed;
          } else {
            effects.push({
              x: otherAnimal.x + otherAnimal.width/2,
              y: otherAnimal.y + otherAnimal.height/2,
              type: "blood",
              lifetime: 30
            });
            animals.splice(index, 1);
          }
          this.infectionCooldown = 60;
        }
      });
    } else if (this.infectionCooldown > 0) {
      this.infectionCooldown--;
    }

    if (this.isSurrounded()) {
      this.isTrapped = true;
      this.currentTexture = this.trappedTexture;
      return;
    } else {
      this.isTrapped = false;
    }

    if (!this.canFly && !this.isOnGround) {
      this.velocityY += this.gravity;
      this.y += this.velocityY;
    }

    if (!this.canFly) {
      this.isOnGround = false;
      for (const block of world) {
        if (
          this.x < block.x + blockSize &&
          this.x + this.width > block.x &&
          this.y + this.height >= block.y &&
          this.y + this.height <= block.y + blockSize
        ) {
          this.y = block.y - this.height;
          this.velocityY = 0;
          this.isOnGround = true;

          if (block.type === "Infect") {
            this.isZombie = true;
            this.textureName = "zombie";
            this.rightTexture.src = `../asset/zombie.png`;
            this.leftTexture.src = `../asset/leftzombie.png`;
            this.trappedTexture.src = `../asset/trapzombie.png`;
          } else if (block.type === "Cure") {
            const nonZombieTypes = Object.keys(animalProperties).filter(type => type !== "Zombie");
            const randomType = nonZombieTypes[Math.floor(Math.random() * nonZombieTypes.length)];
            this.isZombie = false;
            this.textureName = animalProperties[randomType].textureName;
            this.rightTexture.src = `../asset/${this.textureName}.png`;
            this.leftTexture.src = `../asset/left${this.textureName}.png`;
            this.trappedTexture.src = `../asset/trap${this.textureName}.png`;
          } else if (block.type === "Frog") {
            this.textureName = "frog";
            this.rightTexture.src = `../asset/frog.png`;
            this.leftTexture.src = `../asset/leftfrog.png`;
            this.trappedTexture.src = `../asset/trapfrog.png`;
          }

          if (block.type === "Lava") {
            this.health -= 5;
            if (this.health <= 0) {
              this.isDead = true;
              this.currentTexture = this.deathTexture;
              return;
            }
          }

          if (block.type === "Water") {
            // NEW: Only non-swimming mobs are affected by water
            if (!this.canSwim) {
              this.underwaterTimer++;
              if (this.underwaterTimer >= 600) {
                this.isDead = true;
                this.currentTexture = this.deathTexture;
                return;
              }
              this.speed = this.originalSpeed * 0.5;
            }
          } else {
            if (!this.canSwim) {
              this.underwaterTimer = 0;
            }
            this.speed = this.originalSpeed;
          }
        }
      }
    }

    if (this.isBaby) {
      return;
    }

    if (this.isMoving && !this.canFly && this.checkForWall() && !this.isFrog) {
      this.currentDirection *= -1;
    }

    if (this.isMoving) {
      this.x += this.speed * this.currentDirection;

      if (this.currentDirection === 1) {
        this.currentTexture = this.leftTexture;
      } else {
        this.currentTexture = this.rightTexture;
      }

      if (this.x < 0 || this.x + this.width > canvas.width) {
        this.currentDirection *= -1;
      }
    }

    if (this.type === "Bob" || this.type === "Lilly") {
      this.detectAndEatAnimals();
    }

    if (this.isFrog && this.isOnGround && Math.random() < 0.01) {
      this.velocityY = -10;
    }

    if (this.isBaby || this.isChild) {
      this.growthTimer++;
      if (this.isBaby && this.growthTimer >= 3600) {
        this.type = "Child";
        this.textureName = "child";
        this.isBaby = false;
        this.isChild = true;
        this.growthTimer = 0;
        this.rightTexture.src = `../asset/child.png`;
        this.leftTexture.src = `../asset/leftchild.png`;
        this.trappedTexture.src = `../asset/trapchild.png`;
      } else if (this.isChild && this.growthTimer >= 3600) {
        const newType = Math.random() < 0.5 ? "Bob" : "Lilly";
        this.type = newType;
        this.textureName = newType.toLowerCase();
        this.isChild = false;
        this.growthTimer = 0;
        this.rightTexture.src = `../asset/${this.textureName}.png`;
        this.leftTexture.src = `../asset/left${this.textureName}.png`;
        this.trappedTexture.src = `../asset/trap${this.textureName}.png`;
      }
    }

    if (this.faction === FACTION.HOSTILE) {
      this.updateHostile();
    } 
  }

  draw() {
    if (this.currentTexture.complete) {
      ctx.drawImage(this.currentTexture, this.x, this.y, this.width, this.height);

      // NEW: Visual indicators for special mobs
      const isInWater = world.some(block => 
        block.type === "Water" &&
        this.x >= block.x && this.x <= block.x + blockSize &&
        this.y >= block.y && this.y <= block.y + blockSize
      );
      
      if (this.canSwim && isInWater) {
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = "blue";
        ctx.beginPath();
        ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      
      if (this.canFly) {
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(this.x + this.width/2, this.y + this.height + 5, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }
  }
}

    function loadTextures() {
      const loadedTextures = {};
      for (const type in blockTextures) {
        const img = new Image();
        img.src = blockTextures[type];
        img.onerror = () => {
          img.src = errorTexture;
        };
        loadedTextures[type] = img;

        };

    function getRandomTerrainType(seed = currentSeed) {
      const terrains = ['normal', 'sand', 'snow', 'nether', 'end', 'void', 'cherry', 'fallout', 'pale'];
      const hash = Math.sin(seed) * 10000;
      const rand = hash - Math.floor(hash);
      const terrainIndex = Math.floor(rand * terrains.length);
      const terrainType = terrains[terrainIndex];
      
      // Calculate tree count (for applicable biomes)
      let treeCount = 0;
      if (terrainType === 'normal' || terrainType === 'snow') {
        treeCount = Math.floor((rand * 0.2 + 0.05) * (canvas.width/blockSize));
      }
      
      // Calculate animal types
      const animalTypes = [];
      if (terrainType !== 'nether' && terrainType !== 'end' && terrainType !== 'void') {
        const possibleAnimals = Object.keys(animalProperties).filter(type => 
          animalProperties[type].faction === FACTION.PEACEFUL || 
          animalProperties[type].faction === FACTION.HUMAN
        );
        const animalCount = Math.floor(rand * 5) + 1;
        for (let i = 0; i < animalCount; i++) {
          const animalRand = Math.sin(seed + i) * 10000;
          const animalIndex = Math.floor((animalRand - Math.floor(animalRand)) * possibleAnimals.length);
          animalTypes.push(possibleAnimals[animalIndex]);
        }
      }
      
      // Calculate ore distribution (for applicable biomes)
      const oreDistribution = {};
      if (terrainType === 'normal') {
        const ores = ["Diamond ore", "Redstone ore", "Iron ore", "Copper ore", 
                     "Gold ore", "lapiz ore", "Emerald ore", "Coal ore"];
        ores.forEach(ore => {
          const oreRand = Math.sin(seed + ore.length) * 10000;
          oreDistribution[ore] = Math.floor((oreRand - Math.floor(oreRand)) * 10) + 5; // 5-15% chance
        });
      } else if (terrainType === 'nether') {
        const netherOres = ["Quartz ore", "gold ore nether", "netheraite"];
        netherOres.forEach(ore => {
          const oreRand = Math.sin(seed + ore.length) * 10000;
          oreDistribution[ore] = Math.floor((oreRand - Math.floor(oreRand)) * 5) + 5; // 5-10% chance
        });
      }
      
      return {
        type: terrainType,
        treeCount,
        animalTypes,
        oreDistribution
      };
    }

    function generateTerrain(seed = currentSeed) {

  currentSeed = seed;

  worldDetails = {
    treeCount: terrainInfo.treeCount,
    animalTypes: terrainInfo.animalTypes,

  };
  
  seedDisplay.textContent = `Seed: ${currentSeed}`;
  
  const rows = Math.floor(canvas.height / blockSize);
  const cols = Math.floor(canvas.width / blockSize);

  // Stop all ambient sounds
  endAmbience.pause();
  voidAmbience.pause();

  if (currentTerrainType === 'normal') {
    // Generate terrain layers (stone → dirt → grass)
    for (let x = 0; x < cols; x++) {
      for (let y = 0; y < 5; y++) {
        const worldY = rows - 1 - y;
        
        if (y === 0 || y === 1) {
          // Use ore distribution for stone layers

              world.push({ 
                x: x * blockSize, 
                y: worldY * blockSize, 
                type: ore
              });

              break;

            world.push({ x: x * blockSize, y: worldY * blockSize, type: "Stone" });
          }
        } 
        else if (y === 2 || y === 3) {
          world.push({ x: x * blockSize, y: worldY * blockSize, type: "Dirt" });
        } 
        else if (y === 4) {
          world.push({ x: x * blockSize, y: worldY * blockSize, type: "Grass" });
        }
      }

    // Add trees based on calculated count
    for (let i = 0; i < worldDetails.treeCount; i++) {
      const x = Math.floor(Math.sin(seed + i) * 10000 % cols) * blockSize;
      spawnTree(x, (rows - 5) * blockSize, 'normal');
    }
  } 
  else if (currentTerrainType === 'sand') {
    // Beach biome
    for (let x = 0; x < cols; x++) {
      for (let y = rows - 1; y >= rows - 5; y--) {
        if (y === rows - 1) {
          world.push({ x: x * blockSize, y: y * blockSize, type: "Sandstone" });
        } else {
          world.push({ x: x * blockSize, y: y * blockSize, type: "Sand" });
        }
      }
    }
  } 
  else if (currentTerrainType === 'snow') {
    // Snow biome
    for (let x = 0; x < cols; x++) {
      for (let y = rows - 1; y >= rows - 5; y--) {
        world.push({ x: x * blockSize, y: y * blockSize, type: "Snow" });
      }
    }
    
    // Add trees based on calculated count

      spawnTree(x, (rows - 5) * blockSize, 'snow');
    }
  }
  else if (currentTerrainType === 'nether') {
    // Nether biome - updated with 5% lava and only Ghasts
    for (let x = 0; x < cols; x++) {

          });

  }
  else if (currentTerrainType === 'cherry') {

  for (let x = 0; x < cols; x++) {

}
  else if (currentTerrainType === 'fallout') {

    worldDetails.animalTypes = [];
  }
  else if (currentTerrainType === 'pale') {
  // Pale Oak biome
  for (let x = 0; x < cols; x++) {
    for (let y = 0; y < 5; y++) {

    spawnTree(x, (rows - 5) * blockSize, 'pale', 30); // 30% chance

}

  // Spawn animals based on calculated types (except in fallout biome)
  if (currentTerrainType !== 'fallout') {
    worldDetails.animalTypes.forEach((animalType, i) => {
      const x = Math.floor(Math.sin(seed + i + 100) * 10000 % cols) * blockSize;
      animals.push(new Animal(x, (rows - 5) * blockSize, animalType, animalProperties[animalType].speed));
    });
  }

  showBiomeWelcome();
  drawWorld(0);
}
function spawnTree(x, y, biomeType = 'normal', spawnChance = 100) {
  // Only spawn if random number is below the chance threshold
  if (Math.random() * 100 >= spawnChance) {
    return; // Don't spawn this tree
  }

  const trunkHeight = 3;
  const foliageWidth = 3;

  // Determine materials based on biome
  let woodType, leafType;
  
  switch(biomeType) {
    case 'snow':
      woodType = "Spruce wood";
      leafType = "Spruce Leaf";
      break;
    case 'cherry':
      woodType = "Cherry wood";  // Cherry wood for cherry biome
      leafType = "Cherry Leaf";  // Cherry leaves for cherry biome
      break;
    case 'pale':
      woodType = "Pale oak";     // Pale oak wood for pale biome
      leafType = "Pale oak Leaf"; // Pale oak leaves for pale biome
      break;
    default: // normal
      woodType = "Wood";
      leafType = "Leaf";
  }

  // Trunk
  for (let i = 0; i < trunkHeight; i++) {
      world.push({ x: x, y: y - i * blockSize, type: woodType });
  }

  // Leaves
  for (let i = -1; i <= 1; i++) {
      for (let j = -1; j <= 1; j++) {
          if (i !== 0 || j !== 0) {
              world.push({ 
                  x: x + i * blockSize, 
                  y: y - trunkHeight * blockSize + j * blockSize, 
                  type: leafType 
              });
          }
      }
  }
  
  // Special cherry blossom petals under cherry trees
  if (biomeType === 'cherry') {
    for (let i = -2; i <= 2; i++) {
      if (i !== 0) {
        world.push({
          x: x + i * blockSize,
          y: y + blockSize, // Just below the trunk base
          type: "Cherry blossem flower"
        });
      }
    }
  }
}

    function updateDayNightCycle() {
      // 60fps * 60 seconds * 12 minutes = 43200 frames per cycle
      const totalDayNightFrames = 43200; // 12 minutes at 60fps
      const nightStart = totalDayNightFrames / 2; // Night starts halfway
      
      dayNightCycle = (dayNightCycle + 1) % totalDayNightFrames;
      
      if (dayNightCycle === nightStart) {
        currentTime = "night";
        timeDisplay.textContent = "Night";
        if (currentTerrainType !== 'end' && currentTerrainType !== 'void') {
          document.body.style.backgroundColor = "#2E0854"; // Deep purple
        }
        
        // 10% chance to spawn a zombie at night
        if (Math.random() < 0.1 && currentTerrainType !== 'end' && currentTerrainType !== 'void') {
          const cols = Math.floor(canvas.width / blockSize);
          const rows = Math.floor(canvas.height / blockSize);
          const x = Math.floor(Math.random() * cols) * blockSize;
          const y = (rows - 5) * blockSize;
          animals.push(new Animal(x, y, "Zombie", animalProperties["Zombie"].speed));
        }
      } else if (dayNightCycle === 0) {
        currentTime = "day";
        timeDisplay.textContent = "Day";
        if (currentTerrainType !== 'end' && currentTerrainType !== 'void') {
          document.body.style.backgroundColor = "#87CEEB"; // Sky blue
        }
      }
    }

    function updateBlockPhysics() {
      const now = Date.now();
      if (now - lastPhysicsUpdate < PHYSICS_UPDATE_INTERVAL) return;
      lastPhysicsUpdate = now;

      // Process falling blocks (sand/gravel/water/lava)
      for (let i = world.length - 1; i >= 0; i--) {
        const block = world[i];
        const physics = physicsBlocks[block.type];
        
        if (physics && (physics.falls || physics.fluid)) {
          const below = world.find(b => b.x === block.x && b.y === block.y + blockSize);
          const canPassThrough = below && physicsBlocks[below.type]?.fluid;
          
          if (!below || canPassThrough) {
            // Move block down
            world.splice(i, 1);
            block.y += blockSize;
            world.push(block);
            
            // Check if landed on solid ground
            const landedOnSolid = world.some(b => 
              b.x === block.x && 
              b.y === block.y + blockSize && 
              !physicsBlocks[b.type]?.fluid
            );
            
            if (landedOnSolid && physics.spread > 0 && block.type === "Water") {
              // Custom water spread - only add left and right
              const directions = [-1, 1]; // Only left and right
              
              for (const dir of directions) {
                if (!world.some(b => b.x === block.x + dir*blockSize && b.y === block.y)) {
                  world.push({
                    x: block.x + dir*blockSize,
                    y: block.y,
                    type: block.type,
                    fluidLevel: physics.maxLevel - 1,
                    isSource: false
                  });
                }
              }
            }
          }
        }
      }

      // Process fluid spread for existing fluid blocks
      const newFluidBlocks = [];
      for (let i = world.length - 1; i >= 0; i--) {
        const block = world[i];
        const physics = physicsBlocks[block.type];
        
        if (physics && physics.fluid) {
          if (block.fluidLevel === undefined) {
            block.fluidLevel = physics.maxLevel;
            block.isSource = true;
          }
          
          if (block.fluidLevel < physics.maxLevel) continue;
          
          const adjacent = [
            {x: block.x, y: block.y + blockSize},
            {x: block.x - blockSize, y: block.y},
            {x: block.x + blockSize, y: block.y},
            {x: block.x, y: block.y - blockSize}
          ];
          
          for (const pos of adjacent) {
            const existingBlock = world.find(b => b.x === pos.x && b.y === pos.y);
            if (existingBlock && !physicsBlocks[existingBlock.type]?.fluid) continue;
            
            const existingFluid = world.find(b => 
              b.x === pos.x && b.y === pos.y && 
              physicsBlocks[b.type]?.fluid && 
              b.fluidLevel >= block.fluidLevel - 1
            );
            if (existingFluid) continue;
            
            const newLevel = block.fluidLevel - 1;
            if (newLevel > 0) {
              newFluidBlocks.push({
                x: pos.x,
                y: pos.y,
                type: block.type,
                fluidLevel: newLevel,
                isSource: false
              });
            }
          }
        }
      }
      
      world.push(...newFluidBlocks);
    }

    // Herobrine summoning structure (netherrack above 3 gold blocks)

            );
            
            if (gold1 && gold2 && gold3) {
                // Remove the structure blocks
                world.splice(world.indexOf(block), 1);
                world.splice(world.indexOf(gold1), 1);
                world.splice(world.indexOf(gold2), 1);
                world.splice(world.indexOf(gold3), 1);
                
                // Spawn Herobrine
                const herobrine = new Animal(x, y, "Herobrine", 2.5);
                animals.push(herobrine);
                
                // Special effects
                for (let i = 0; i < 20; i++) {
                    effects.push({
                        x: x + blockSize/2 + (Math.random() - 0.5) * 50,
                        y: y + blockSize/2 + (Math.random() - 0.5) * 50,
                        type: "herobrine",
                        lifetime: 60 + Math.random() * 30
                    });
                }
                
                // Play scary sound
                const herobrineSound = new Audio("../sound/herobrine.mp3");
                herobrineSound.volume = 0.7;
                herobrineSound.play().catch(e => console.log("Audio play prevented:", e));
                
                // Notification
                saveLoadNotification.textContent = "HEROBRINE HAS AWAKENED!";
                saveLoadNotification.style.display = "block";
                setTimeout(() => {
                    saveLoadNotification.style.display = "none";
                }, 5000);
                
                // Make all zombies stronger when Herobrine appears
                animals.forEach(animal => {
                    if (animal.type === "Zombie") {
                        animal.health = 30;
                        animal.speed = 2;
                    }
                });
                
                break;
            }
        }
    }
}

    function drawWorld(timestamp) {
      // Set background based on biome
      if (currentTerrainType === 'end') {
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else if (currentTerrainType === 'void') {
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      
      // Draw blocks
      world.forEach(block => {
        if (physicsBlocks[block.type]?.fluid) {
          const fluidHeight = blockSize * (block.fluidLevel / physicsBlocks[block.type].maxLevel);
          ctx.save();
          ctx.globalAlpha = 0.7;
          ctx.drawImage(
            textures[block.type], 
            block.x, 
            block.y + (blockSize - fluidHeight), 
            blockSize, 
            fluidHeight
          );
          ctx.restore();
        } else if (block.type === "Shulker mob (animateted)") {
          if (!block.spriteAnimation) {
            block.spriteAnimation = new SpriteAnimationBlock(block.x, block.y);
          }
          block.spriteAnimation.update(timestamp);
          block.spriteAnimation.draw();
        } else if (textures[block.type]) {
          ctx.drawImage(textures[block.type], block.x, block.y, blockSize, blockSize);
        }
      });

      // Draw animals
      animals.forEach(animal => animal.draw());
      
      // Draw projectiles
      fireballs.forEach(fireball => {
        fireball.update();
        fireball.draw();
      });
      witherSkulls.forEach(skull => {
        skull.update();
        skull.draw();
      });
      
      // Draw effects
      for (let i = effects.length - 1; i >= 0; i--) {
        const effect = effects[i];
        effect.lifetime--;
        
        if (effect.lifetime <= 0) {
          effects.splice(i, 1);
          continue;
        }
        
        if (effect.type === "infection") {
          ctx.save();
          ctx.globalAlpha = effect.lifetime / 60;
          ctx.fillStyle = `rgba(0, 255, 0, ${0.5 * (effect.lifetime / 60)})`;
          ctx.beginPath();
          ctx.arc(effect.x, effect.y, 50 * (1 - effect.lifetime / 60), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else if (effect.type === "blood") {
          ctx.save();
          ctx.globalAlpha = effect.lifetime / 30;
          ctx.fillStyle = `rgba(255, 0, 0, ${0.7 * (effect.lifetime / 30)})`;
          ctx.beginPath();
          ctx.arc(effect.x, effect.y, 30 * (1 - effect.lifetime / 30), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // Special effects for biomes
      if (currentTerrainType === 'end') {
        // End particles (ender particles)
        if (Math.random() < 0.03) {
          ctx.save();
          ctx.globalAlpha = Math.random() * 0.5;
          ctx.fillStyle = `hsl(${Math.random() * 60 + 270}, 100%, 50%)`;
          ctx.beginPath();
          const px = Math.random() * canvas.width;
          const py = Math.random() * canvas.height;
          ctx.arc(px, py, Math.random() * 5 + 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      } else if (currentTerrainType === 'void') {
        // Void particles (dark fading circles)
        if (Math.random() < 0.05) {
          ctx.save();
          ctx.globalAlpha = Math.random() * 0.3;
          ctx.fillStyle = `rgba(0, 0, 0, ${Math.random() * 0.5})`;
          ctx.beginPath();
          const px = Math.random() * canvas.width;
          const py = Math.random() * canvas.height;
          const size = Math.random() * 20 + 10;
          ctx.arc(px, py, size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    function explodeTNT(x, y) {
      const explosionRadius = 5;
      const damage = 9;

      for (let i = world.length - 1; i >= 0; i--) {
        const block = world[i];
        const dx = block.x - x;
        const dy = block.y - y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < explosionRadius * blockSize) {
          // Stop jukebox music if destroyed
          if (block.type === "JukeBox") {
            jukeboxSound1.pause();
            jukeboxSound2.pause();
            jukeboxState = 0;
            jukeboxPlaying = null;
          }
          world.splice(i, 1);
        }
      }

      animals.forEach(animal => {
        const dx = animal.x - x;
        const dy = animal.y - y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < explosionRadius * blockSize) {
          animal.health -= damage;
          if (animal.health <= 0) {
            animal.isDead = true;
          }
        }
      });
    }

    function handleMouseClick(event) {
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mouseX = event.clientX - rect.left;
      const mouseY = event.clientY - rect.top;

      if (showMenu || codeMenuOpen) return;

      const gridX = Math.floor(mouseX / blockSize) * blockSize;
      const gridY = Math.floor(mouseY / blockSize) * blockSize;

      if (event.button === 0) {
        // Left click - destroy
        if (musicEnabled) {
          destroySound.currentTime = 0;
          destroySound.play().catch(e => console.log("Audio play prevented:", e));
        }
        
        for (let i = 0; i < world.length; i++) {
          if (gridX === world[i].x && gridY === world[i].y) {
            // Stop jukebox music if destroyed
            if (world[i].type === "JukeBox") {
              jukeboxSound1.pause();
              jukeboxSound2.pause();
              jukeboxState = 0;
              jukeboxPlaying = null;
            }
            world.splice(i, 1);
            break;
          }
        }

        for (let i = 0; i < animals.length; i++) {
          const animal = animals[i];
          if (
            mouseX >= animal.x &&
            mouseX <= animal.x + animal.width &&
            mouseY >= animal.y &&
            mouseY <= animal.y + animal.height
          ) {
            animals.splice(i, 1);
            break;
          }
        }
      } else if (event.button === 1) {
        // Middle click - check for different actions
        const jukebox = world.find(b => b.x === gridX && b.y === gridY && b.type === "JukeBox");
        const tntBlock = world.find(b => b.x === gridX && b.y === gridY && b.type === "TNT");
        const clickedBlock = world.find(b => b.x === gridX && b.y === gridY);
        
        if (jukebox) {
          // Cycle through jukebox states
          jukeboxState = (jukeboxState + 1) % 3;
          
          // Stop any currently playing music
          jukeboxSound1.pause();
          jukeboxSound2.pause();
          
          if (jukeboxState === 1) {
            // Play rd.mp3
            if (musicEnabled) {
              jukeboxSound1.currentTime = 0;
              jukeboxSound1.play().catch(e => console.log("Audio play prevented:", e));
              jukeboxPlaying = jukeboxSound1;
            }
          } else if (jukeboxState === 2) {
            // Play Dr.mp3
            if (musicEnabled) {
              jukeboxSound2.currentTime = 0;
              jukeboxSound2.play().catch(e => console.log("Audio play prevented:", e));
              jukeboxPlaying = jukeboxSound2;
            }
          } else {
            // Turn off
            jukeboxPlaying = null;
          }
        } 
        else if (tntBlock) {
          // Handle TNT explosion with sound
          if (musicEnabled) {
            const tntSound = document.getElementById("tntSound");
            tntSound.currentTime = 0;
            tntSound.play().catch(e => console.log("Audio play prevented:", e));
            
            setTimeout(() => {
              explodeTNT(tntBlock.x, tntBlock.y);
              world.splice(world.indexOf(tntBlock), 1);
              drawWorld(0);
            }, 1000);
          } else {
            explodeTNT(tntBlock.x, tntBlock.y);
            world.splice(world.indexOf(tntBlock), 1);
            drawWorld(0);
          }
        }
        else if (!clickedBlock) {
          // Middle click on sky (no block) - check for baby spawn
          const bob = animals.find(animal => animal.type === "Bob");
          const lilly = animals.find(animal => animal.type === "Lilly");
          const currentTime = Date.now();
          
          if (bob && lilly) {
            if (currentTime - lastBabySpawnTime >= BABY_COOLDOWN) {
              // Spawn baby in the middle of the screen
              const babyX = canvas.width / 2 - blockSize / 2;
              const babyY = canvas.height / 2 - blockSize / 2;
              
              // Move parents to center
              bob.x = babyX - blockSize;
              bob.y = babyY;
              lilly.x = babyX + blockSize;
              lilly.y = babyY;
              
              animals.push(new Animal(babyX, babyY, "Child", 1.5));
              lastBabySpawnTime = currentTime;
              
              // Show success message
              saveLoadNotification.textContent = "A new baby was born!";
              saveLoadNotification.style.display = "block";
              setTimeout(() => {
                saveLoadNotification.style.display = "none";
              }, 3000);
            } else {
              // Show cooldown message
              const remainingMinutes = ((BABY_COOLDOWN - (currentTime - lastBabySpawnTime)) / 60000).toFixed(1);
              saveLoadNotification.textContent = `Please wait ${remainingMinutes} more minutes before having another baby.`;
              saveLoadNotification.style.display = "block";
              setTimeout(() => {
                saveLoadNotification.style.display = "none";
              }, 3000);
            }
          }
        }
        else {
          // Original middle click behavior for ghasts
          for (let i = 0; i < animals.length; i++) {
            const animal = animals[i];
            if (
              animal.type === "Ghast" &&
              mouseX >= animal.x &&
              mouseX <= animal.x + animal.width &&
              mouseY >= animal.y &&
              mouseY <= animal.y + animal.height
            ) {
              const target = animals.find(animal => animal.type === "Bob" || animal.type === "Lilly");
              if (target) {
                fireballs.push(new Projectile(
                  animal.x, animal.y, 
                  target.x, target.y, 
                  "fireball", 
                  8,
                  5,
                  FACTION.HOSTILE
                ));
              }
              break;
            }
          }
        }
      } else if (event.button === 2) {
        // Right click - place
        if (musicEnabled) {
          placeSound.currentTime = 0;
          placeSound.play().catch(e => console.log("Audio play prevented:", e));
        }
        
        const targetBlock = world.find(b => b.x === gridX && b.y === gridY);
        
        if (!targetBlock || (targetBlock && physicsBlocks[targetBlock.type]?.fluid)) {
          if (currentBlockType.endsWith(" Spawn Egg")) {
            const animalName = currentBlockType.replace(" Spawn Egg", "");
            if (animalProperties[animalName]) {
              const { speed } = animalProperties[animalName];
              if (zombiesAreFriendly && animalName === "Zombie") {
                const newType = Math.random() < 0.5 ? "Bob" : "Lilly";
                animals.push(new Animal(gridX, gridY, newType, speed));
              } else {
                animals.push(new Animal(gridX, gridY, animalName, speed));
              }
            }
          } else {
            if (targetBlock) {
              world.splice(world.indexOf(targetBlock), 1);
            }
            world.push({ x: gridX, y: gridY, type: currentBlockType });
          }
        }
      }
      drawWorld(0);
    }

    // Save/Load functions
    function saveWorld() {
      const worldData = {
        version: 1,
        name: worldName,
        seed: currentSeed,
        blocks: world,
        animals: animals.map(animal => ({
          type: animal.type,
          x: animal.x,
          y: animal.y,
          speed: animal.speed,
          health: animal.health,
          direction: animal.direction,
          isTrapped: animal.isTrapped,
          isZombie: animal.isZombie
        })),
        currentTime: currentTime,
        dayNightCycle: dayNightCycle,
        currentTerrainType: currentTerrainType,
        currentBlockType: currentBlockType,
        zombiesAreFriendly: zombiesAreFriendly,
        worldDetails: worldDetails
      };

      const dataStr = JSON.stringify(worldData, null, 2);
      const blob = new Blob([dataStr], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      
      saveLink.href = url;
      saveLink.download = `${worldName}.mc`;
      saveLink.click();
      
      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 100);

      // Show notification
      saveLoadNotification.textContent = "World saved successfully!";
      saveLoadNotification.style.display = "block";
      setTimeout(() => {
        saveLoadNotification.style.display = "none";
      }, 3000);
    }

    function loadWorld(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const worldData = JSON.parse(e.target.result);
          
          // Load seed if it exists
          if (worldData.seed) {
            currentSeed = worldData.seed;
            seedDisplay.textContent = `Seed: ${currentSeed}`;
          }
          
          // Clear current world
          world.length = 0;
          animals.length = 0;
          
          // Load blocks
          if (worldData.blocks && Array.isArray(worldData.blocks)) {
            world.push(...worldData.blocks);
          }
          
          // Load animals
          if (worldData.animals && Array.isArray(worldData.animals)) {
            worldData.animals.forEach(animalData => {
              const animal = new Animal(
                animalData.x, 
                animalData.y, 
                animalData.type, 
                animalData.speed || animalProperties[animalData.type]?.speed || 1
              );
              
              // Restore additional properties
              if (animalData.health) animal.health = animalData.health;
              if (animalData.direction) animal.direction = animalData.direction;
              if (animalData.isTrapped) animal.isTrapped = animalData.isTrapped;
              if (animalData.isZombie) {
                animal.isZombie = animalData.isZombie;
                if (animal.isZombie) {
                  animal.textureName = "zombie";
                  animal.rightTexture.src = `../asset/zombie.png`;
                  animal.leftTexture.src = `../asset/leftzombie.png`;
                  animal.trappedTexture.src = `../asset/trapzombie.png`;
                }
              }
              
              animals.push(animal);
            });
          }
          
          // Restore other state
          if (worldData.currentTime) currentTime = worldData.currentTime;
          if (worldData.dayNightCycle) dayNightCycle = worldData.dayNightCycle;
          if (worldData.currentTerrainType) currentTerrainType = worldData.currentTerrainType;
          if (worldData.currentBlockType) currentBlockType = worldData.currentBlockType;
          if (worldData.zombiesAreFriendly !== undefined) {
            zombiesAreFriendly = worldData.zombiesAreFriendly;
          }
          
          if (worldData.name) {
            worldName = worldData.name;
          }
          
          if (worldData.worldDetails) {
            worldDetails = worldData.worldDetails;
          }
          
          drawWorld(0);
          
          // Play background music when world loads
          if (backgroundMusicEnabled) {
            backgroundMusic.currentTime = 0;
            backgroundMusic.play().catch(e => console.log("Autoplay prevented:", e));
          }
          
          // Play biome-specific ambience
          if (currentTerrainType === 'end' && musicEnabled) {
            endAmbience.currentTime = 0;
            endAmbience.volume = 0.3;
            endAmbience.play().catch(e => console.log("Audio play prevented:", e));
          } else if (currentTerrainType === 'void' && musicEnabled) {
            voidAmbience.currentTime = 0;
            voidAmbience.volume = 0.2;
            voidAmbience.play().catch(e => console.log("Audio play prevented:", e));
          }
          
          // Show notification
          saveLoadNotification.textContent = `World "${worldName}" loaded successfully!`;
          saveLoadNotification.style.display = "block";
          setTimeout(() => {
            saveLoadNotification.style.display = "none";
          }, 3000);
        } catch (error) {
          console.error("Error loading world:", error);
          saveLoadNotification.textContent = "Failed to load world. The file might be corrupted.";
          saveLoadNotification.style.display = "block";
          setTimeout(() => {
            saveLoadNotification.style.display = "none";
          }, 3000);
        }
      };
      reader.readAsText(file);
    }

  // Updated keydown handler (full version)
document.addEventListener("keydown", (event) => {
  // If search input is focused, ignore ALL shortcuts (including Tab)
  if (document.activeElement === searchInput) {
    return; // Exit early, ignore all keys when typing in search
  }

  // --- Original shortcut logic (only runs when search is NOT focused) ---
  // Tab key to toggle code input menu
  if (event.key === "Tab") {
    event.preventDefault();
    codeMenuOpen = !codeMenuOpen;
    codeInputContainer.style.display = codeMenuOpen ? "block" : "none";
    
    if (codeMenuOpen) {
      codeInput.focus();
    } else {
      codeInput.value = "";
    }
    return;
  }

  // 0 key to enter seed
  if (event.key === "0") {
    event.preventDefault();
    showSeedInput();
    return;
  }

  // 1 key to show current seed
  if (event.key === "1") {
    event.preventDefault();
    showCurrentSeed();
    return;
  }

  // C key to open blocks menu
  if (event.key.toLowerCase() === "c") {
    event.preventDefault();
    toggleMenu("blocks");
    return;
  }

  // S key to open spawn eggs menu
  if (event.key.toLowerCase() === "s") {
    event.preventDefault();
    toggleMenu("spawnEggs");
    return;
  }

  // Space to pause
  if (event.key.toLowerCase() === " ") {
    isPaused = !isPaused;
  }

  // 5 to toggle zombie friendliness
  if (event.key === "5") {
    zombiesAreFriendly = !zombiesAreFriendly;
    alert(`Zombies are now ${zombiesAreFriendly ? "friendly (Bob/Lilly)" : "normal"}`);
  }

  // T to open texture pack selector
  if (event.key.toLowerCase() === "t") {
    document.getElementById("texturePackInput").click();
  }

  // V to save world
  if (event.key.toLowerCase() === "v") {
    saveWorld();
  }

  // B to load world
  if (event.key.toLowerCase() === "b") {
    loadInput.click();
  }

  // Q to toggle all music
  if (event.key.toLowerCase() === "q") {
    musicEnabled = !musicEnabled;
    if (!musicEnabled) {
      backgroundMusic.pause();
      endAmbience.pause();
      voidAmbience.pause();
      jukeboxSound1.pause();
      jukeboxSound2.pause();
    } else {
      if (currentTerrainType === 'end') {
        endAmbience.currentTime = 0;
        endAmbience.volume = 0.3;
        endAmbience.play().catch(e => console.log("Audio play prevented:", e));
      } else if (currentTerrainType === 'void') {
        voidAmbience.currentTime = 0;
        voidAmbience.volume = 0.2;
        voidAmbience.play().catch(e => console.log("Audio play prevented:", e));
      } else {
        backgroundMusic.currentTime = 0;
        backgroundMusic.play().catch(e => console.log("Audio play prevented:", e));
      }
      if (jukeboxPlaying) {
        jukeboxPlaying.play().catch(e => console.log("Audio play prevented:", e));
      }
    }
    alert(`All music ${musicEnabled ? "enabled" : "disabled"}`);
  }

  // P to toggle background music only
  if (event.key.toLowerCase() === "p") {
    backgroundMusicEnabled = !backgroundMusicEnabled;
    if (!backgroundMusicEnabled) {
      backgroundMusic.pause();
    } else if (musicEnabled) {
      backgroundMusic.play().catch(e => console.log("Audio play prevented:", e));
    }
    alert(`Background music ${backgroundMusicEnabled ? "enabled" : "disabled"}`);
  }

  // F11 for fullscreen
  if (event.key === "F11") {
    event.preventDefault();
    toggleFullscreen();
  }
});

// Updated search input handler (prevents ALL key events from bubbling)
searchInput.addEventListener('keydown', (e) => {
  e.stopPropagation(); // Completely blocks shortcuts while typing
});
    document.getElementById("texturePackInput").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const zip = new JSZip();
        zip.loadAsync(e.target.result).then((zip) => {
          const assetFolder = zip.folder("asset");
          if (!assetFolder) {
            alert("The ZIP file must contain an 'asset' folder.");
            return;
          }

          const blocksTexture = assetFolder.file("blocks.png");
          if (blocksTexture) {
            blocksTexture.async("blob").then((blob) => {
              const url = URL.createObjectURL(blob);

              for (const type in blockTextures) {
                blockTextures[type] = url;
              }

              textures = loadTextures();
              drawWorld(0);
              alert("blocks.png loaded successfully! All block textures replaced.");
            });
          }

          const allTexture = assetFolder.file("all.png");
          const leftAllTexture = assetFolder.file("leftall.png");
          const trapAllTexture = assetFolder.file("trapall.png");

          if (allTexture && leftAllTexture && trapAllTexture) {
            Promise.all([
              allTexture.async("blob"),
              leftAllTexture.async("blob"),
              trapAllTexture.async("blob")
            ]).then(([allBlob, leftAllBlob, trapAllBlob]) => {
              const allUrl = URL.createObjectURL(allBlob);
              const leftAllUrl = URL.createObjectURL(leftAllBlob);
              const trapAllUrl = URL.createObjectURL(trapAllBlob);

              animals.forEach(animal => {
                animal.rightTexture = new Image();
                animal.rightTexture.src = allUrl;
                animal.leftTexture = new Image();
                animal.leftTexture.src = leftAllUrl;
                animal.trappedTexture = new Image();
                animal.trappedTexture.src = trapAllUrl;
              });

              drawWorld(0);
              alert("all.png, leftall.png, and trapall.png loaded successfully! All mob textures replaced.");
            }).catch((error) => {
              console.error("Failed to load mob textures:", error);
              alert("Failed to load mob textures. Check the console for details.");
            });
          } else {
            assetFolder.forEach((relativePath, file) => {
              if (!file.dir) {
                const fileName = relativePath.split("/").pop();
                const textureKey = Object.keys(blockTextures).find(
                  (key) => blockTextures[key].endsWith(fileName)
                ) || Object.keys(spawnEggTextures).find(
                  (key) => spawnEggTextures[key].endsWith(fileName)
                );

                if (textureKey) {
                  file.async("blob").then((blob) => {
                    const url = URL.createObjectURL(blob);

                    if (blockTextures[textureKey]) {
                      blockTextures[textureKey] = url;
                    } else if (spawnEggTextures[textureKey]) {
                      spawnEggTextures[textureKey] = url;
                    }

                    textures = loadTextures();
                    drawWorld(0);
                  });
                }

                animals.forEach(animal => {
                  const textureName = animal.textureName;
                  if (fileName === `${textureName}.png` || fileName === `left${textureName}.png` || fileName === `trap${textureName}.png`) {
                    file.async("blob").then((blob) => {
                      const url = URL.createObjectURL(blob);

                      if (fileName === `${textureName}.png`) {
                        animal.rightTexture = new Image();
                        animal.rightTexture.src = url;
                      } else if (fileName === `left${textureName}.png`) {
                        animal.leftTexture = new Image();
                        animal.leftTexture.src = url;
                      } else if (fileName === `trap${textureName}.png`) {
                        animal.trappedTexture = new Image();
                        animal.trappedTexture.src = url;
                      }

                      drawWorld(0);
                    });
                  }
                });
              }
            });

            alert("Texture pack loaded successfully!");
          }
        }).catch((error) => {
          console.error("Failed to load texture pack:", error);
          alert("Failed to load the texture pack. Check the console for details.");
        });
      };
      reader.readAsArrayBuffer(file);
    });

    // Initialize with random terrain using current seed
    generateTerrain(currentSeed);
    

    canvas.addEventListener("contextmenu", (event) => event.preventDefault());
    canvas.addEventListener("mousedown", handleMouseClick);

    function gameLoop(timestamp) {
      if (!isPaused) {
        animals.forEach(animal => animal.update());
        updateBlockPhysics();
        checkStructures();
        updateDayNightCycle();
      }
      drawWorld(timestamp);
      requestAnimationFrame(gameLoop);
    }

    gameLoop(0);

    searchInput.addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase();
      
      if (currentMenuType === "blocks") {
        filteredItems = Object.keys(blockTextures).filter(item => 
          item.toLowerCase().includes(searchTerm)
        );
      } else if (currentMenuType === "spawnEggs") {
        filteredItems = Object.keys(spawnEggTextures).filter(item => 
          item.toLowerCase().includes(searchTerm)
        );
      }
      
      updateMenu();
    });

    document.addEventListener('DOMContentLoaded', () => {
      const bgMusic = document.getElementById('backgroundMusic');
      bgMusic.volume = 0.5; // Lower volume to 50%
      bgMusic.play().catch(e => {
        console.log("Autoplay prevented, will play after interaction:", e);
        // Fallback: Play after any user interaction
        const playOnInteraction = () => {
          bgMusic.play().catch(e => console.log("Still can't play:", e));
          document.removeEventListener('click', playOnInteraction);
        };
        document.addEventListener('click', playOnInteraction);
      });
    });

    // Add new controller variables
    let gamepadConnected = false;
    let gamepadIndex = null;
    let cursorX = canvas.width / 2;
    let cursorY = canvas.height / 2;
    let lastButtonState = {};
    let controllerDebounce = {};
    const buttonMap = {
      0: 'A', 1: 'B', 2: 'X', 3: 'Y',
      4: 'LB', 5: 'RB', 6: 'LT', 7: 'RT',
      8: 'Back', 9: 'Start',
      10: 'LStick', 11: 'RStick',
      12: 'DPadUp', 13: 'DPadDown',
      14: 'DPadLeft', 15: 'DPadRight'
    };

    // Add gamepad connection listeners
    window.addEventListener("gamepadconnected", (e) => {
      gamepadConnected = true;
      gamepadIndex = e.gamepad.index;
      console.log(`Gamepad ${e.gamepad.id} connected`);
      document.getElementById('controllerHint').style.display = 'block';
      updateControllerHint();
    });

    window.addEventListener("gamepaddisconnected", (e) => {
      if (e.gamepad.index === gamepadIndex) {
        gamepadConnected = false;
        gamepadIndex = null;
        document.getElementById('controllerHint').style.display = 'none';
      }
    });

    function updateControllerHint() {
      const hint = document.getElementById('controllerHint');
      hint.innerHTML = `
        <strong>Controller Controls:</strong><br>
        <strong>X</strong>: Block/Mob Menu<br>
        <strong>Y</strong>: Place Block<br>
        <strong>A</strong>: Destroy Block<br>
        <strong>B</strong>: Special Action<br>
        <strong>Start</strong>: Pause Mobs<br>
        <strong>Left Stick</strong>: Move Cursor<br>
        <strong>Right Stick</strong>: Scroll Menu
      `;
    }

    function checkGamepadInput() {
      if (!gamepadConnected) return;
      
      const gamepad = navigator.getGamepads()[gamepadIndex];
      if (!gamepad) return;

      // Update cursor position with left stick
      const leftStickX = gamepad.axes[0];
      const leftStickY = gamepad.axes[1];
      
      if (Math.abs(leftStickX) > 0.1) {
        cursorX += leftStickX * 10;
        cursorX = Math.max(0, Math.min(canvas.width, cursorX));
      }
      if (Math.abs(leftStickY) > 0.1) {
        cursorY += leftStickY * 10;
        cursorY = Math.max(0, Math.min(canvas.height, cursorY));
      }

      // Update cursor visual
      const cursorElement = document.getElementById('controllerCursor');
      cursorElement.style.left = `${cursorX}px`;
      cursorElement.style.top = `${cursorY}px`;

      // Check button presses
      gamepad.buttons.forEach((button, index) => {
        const buttonName = buttonMap[index];
        const pressed = button.pressed;
        
        // Only trigger on button down (not while held)
        if (pressed && (!lastButtonState[buttonName] || (Date.now() - (controllerDebounce[buttonName] || 0)) > 200)) {
          controllerDebounce[buttonName] = Date.now();
          
          switch(buttonName) {
            case 'X':
              // X → Block & Mob Menu
              toggleMenu("blocks");
              break;
              
            case 'Y':
              // Y → Place (right click equivalent)
              simulateRightClick();
              break;
              
            case 'A':
              // A → Destroy (left click equivalent)
              simulateLeftClick();
              break;
              
            case 'B':
              // B → Middle Click Menu
              simulateMiddleClick();
              break;
              
            case 'Start':
              // Start → Pause mobs
              isPaused = !isPaused;
              saveLoadNotification.textContent = `Mobs ${isPaused ? "paused" : "unpaused"}`;
              saveLoadNotification.style.display = "block";
              setTimeout(() => {
                saveLoadNotification.style.display = "none";
              }, 2000);
              break;
              
            case 'Back':
              // Back → Toggle fullscreen
              toggleFullscreen();
              break;
          }
        }
        
        lastButtonState[buttonName] = pressed;
      });

      // Right stick for menu scrolling
      if (showMenu) {
        const rightStickY = gamepad.axes[3];
        if (Math.abs(rightStickY) > 0.5) {
          menuContainer.scrollTop += rightStickY * 10;
        }
      }
    }

    function simulateLeftClick() {
      if (showMenu || codeMenuOpen) return;
      
      const gridX = Math.floor(cursorX / blockSize) * blockSize;
      const gridY = Math.floor(cursorY / blockSize) * blockSize;

      if (musicEnabled) {
        destroySound.currentTime = 0;
        destroySound.play().catch(e => console.log("Audio play prevented:", e));
      }
      
      for (let i = 0; i < world.length; i++) {
        if (gridX === world[i].x && gridY === world[i].y) {
          if (world[i].type === "JukeBox") {
            jukeboxSound1.pause();
            jukeboxSound2.pause();
            jukeboxState = 0;
            jukeboxPlaying = null;
          }
          world.splice(i, 1);
          break;
        }
      }

      for (let i = 0; i < animals.length; i++) {
        const animal = animals[i];
        if (
          cursorX >= animal.x &&
          cursorX <= animal.x + animal.width &&
          cursorY >= animal.y &&
          cursorY <= animal.y + animal.height
        ) {
          animals.splice(i, 1);
          break;
        }
      }
      drawWorld(0);
    }

    function simulateRightClick() {
      if (showMenu || codeMenuOpen) return;
      
      const gridX = Math.floor(cursorX / blockSize) * blockSize;
      const gridY = Math.floor(cursorY / blockSize) * blockSize;

      if (musicEnabled) {
        placeSound.currentTime = 0;
        placeSound.play().catch(e => console.log("Audio play prevented:", e));
      }
      
      const targetBlock = world.find(b => b.x === gridX && b.y === gridY);
      
      if (!targetBlock || (targetBlock && physicsBlocks[targetBlock.type]?.fluid)) {
        if (currentBlockType.endsWith(" Spawn Egg")) {
          const animalName = currentBlockType.replace(" Spawn Egg", "");
          if (animalProperties[animalName]) {
            const { speed } = animalProperties[animalName];
            if (zombiesAreFriendly && animalName === "Zombie") {
              const newType = Math.random() < 0.5 ? "Bob" : "Lilly";
              animals.push(new Animal(gridX, gridY, newType, speed));
            } else {
              animals.push(new Animal(gridX, gridY, animalName, speed));
            }
          }
        } else {
          if (targetBlock) {
            world.splice(world.indexOf(targetBlock), 1);
          }
          world.push({ x: gridX, y: gridY, type: currentBlockType });
        }
      }
      drawWorld(0);
    }

    function simulateMiddleClick() {
      const gridX = Math.floor(cursorX / blockSize) * blockSize;
      const gridY = Math.floor(cursorY / blockSize) * blockSize;

      const jukebox = world.find(b => b.x === gridX && b.y === gridY && b.type === "JukeBox");
      const tntBlock = world.find(b => b.x === gridX && b.y === gridY && b.type === "TNT");
      const clickedBlock = world.find(b => b.x === gridX && b.y === gridY);
      
      if (jukebox) {
        // Cycle through jukebox states
        jukeboxState = (jukeboxState + 1) % 3;
        
        // Stop any currently playing music
        jukeboxSound1.pause();
        jukeboxSound2.pause();
        
        if (jukeboxState === 1) {
          // Play rd.mp3
          if (musicEnabled) {
            jukeboxSound1.currentTime = 0;
            jukeboxSound1.play().catch(e => console.log("Audio play prevented:", e));
            jukeboxPlaying = jukeboxSound1;
          }
        } else if (jukeboxState === 2) {
          // Play Dr.mp3
          if (musicEnabled) {
            jukeboxSound2.currentTime = 0;
            jukeboxSound2.play().catch(e => console.log("Audio play prevented:", e));
            jukeboxPlaying = jukeboxSound2;
          }
        } else {
          // Turn off
          jukeboxPlaying = null;
        }
      } 
      else if (tntBlock) {
        // Handle TNT explosion with sound
        if (musicEnabled) {
          const tntSound = document.getElementById("tntSound");
          tntSound.currentTime = 0;
          tntSound.play().catch(e => console.log("Audio play prevented:", e));
          
          setTimeout(() => {
            explodeTNT(tntBlock.x, tntBlock.y);
            world.splice(world.indexOf(tntBlock), 1);
            drawWorld(0);
          }, 1000);
        } else {
          explodeTNT(tntBlock.x, tntBlock.y);
          world.splice(world.indexOf(tntBlock), 1);
          drawWorld(0);
        }
      }
      else if (!clickedBlock) {
        // Middle click on sky (no block) - check for baby spawn
        const bob = animals.find(animal => animal.type === "Bob");
        const lilly = animals.find(animal => animal.type === "Lilly");
        const currentTime = Date.now();
        
        if (bob && lilly) {
          if (currentTime - lastBabySpawnTime >= BABY_COOLDOWN) {
            // Spawn baby in the middle of the screen
            const babyX = canvas.width / 2 - blockSize / 2;
            const babyY = canvas.height / 2 - blockSize / 2;
            
            // Move parents to center
            bob.x = babyX - blockSize;
            bob.y = babyY;
            lilly.x = babyX + blockSize;
            lilly.y = babyY;
            
            animals.push(new Animal(babyX, babyY, "Child", 1.5));
            lastBabySpawnTime = currentTime;
            
            // Show success message
            saveLoadNotification.textContent = "A new baby was born!";
            saveLoadNotification.style.display = "block";
            setTimeout(() => {
              saveLoadNotification.style.display = "none";
            }, 3000);
          } else {
            // Show cooldown message
            const remainingMinutes = ((BABY_COOLDOWN - (currentTime - lastBabySpawnTime)) / 60000).toFixed(1);
            saveLoadNotification.textContent = `Please wait ${remainingMinutes} more minutes before having another baby.`;
            saveLoadNotification.style.display = "block";
            setTimeout(() => {
              saveLoadNotification.style.display = "none";
            }, 3000);
          }
        }
      }
      else {
        // Original middle click behavior for ghasts
        for (let i = 0; i < animals.length; i++) {
          const animal = animals[i];
          if (
            animal.type === "Ghast" &&
            cursorX >= animal.x &&
            cursorX <= animal.x + animal.width &&
            cursorY >= animal.y &&
            cursorY <= animal.y + animal.height
          ) {
            const target = animals.find(animal => animal.type === "Bob" || animal.type === "Lilly");
            if (target) {
              fireballs.push(new Projectile(
                animal.x, animal.y, 
                target.x, target.y, 
                "fireball", 
                8,
                5,
                FACTION.HOSTILE
              ));
            }
            break;
          }
        }
      }
    }

    // Modify the game loop to include controller input
    function gameLoop(timestamp) {
      checkGamepadInput(); // Add this line
      
      if (!isPaused) {
        animals.forEach(animal => animal.update());
        updateBlockPhysics();
        checkStructures();
        updateDayNightCycle();
      }
      drawWorld(timestamp);
      requestAnimationFrame(gameLoop);
    }

    // Previous code remains the same until the game loop initialization
    // Initialize with random terrain using current seed
    generateTerrain(currentSeed);
    
    canvas.addEventListener("contextmenu", (event) => event.preventDefault());
    canvas.addEventListener("mousedown", handleMouseClick);

    // Start the game loop
    gameLoop(0);
  </script>
